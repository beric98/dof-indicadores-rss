name: Actualizar RSS diario

on:
  schedule:
    # Lunes a viernes, cada ~15 min de 06:07 a 08:52 hora de México (UTC-6), en minutos
    # poco usados: GitHub retrasa las tareas programadas (con una sola corrida a las
    # 06:15 llegaban entre las 06:50 y las 17:00). El ERP de Paraíso Mahahual decide a
    # partir de las 08:00 si hoy hubo publicación del tipo de cambio en el DOF, y usa
    # este feed cuando no logra leer el DOF directo.
    - cron: '7,22,37,52 12-14 * * 1-5'
    # Una más a media mañana, por si las de temprano no corrieron.
    - cron: '41 16 * * 1-5'
  workflow_dispatch:

# Dos corridas a la vez se pisarían al hacer push.
concurrency:
  group: rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script RSS
        run: python rss_gen2.py

      - name: Hacer commit si hay cambios
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add dof_rss.xml
          git diff --cached --quiet || git commit -m "Actualizar RSS automático"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
